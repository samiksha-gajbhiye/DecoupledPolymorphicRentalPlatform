<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>

<form>

    <label>Name</label><br>
    <input type="text" id="name"><br><br>

    <label>Email</label><br>
    <input type="email" id="email"><br><br>

    <label>Password</label><br>
    <input type="password" id="password"><br><br>

    <label>Phone</label><br>
    <input type=" number" id="phone"><br><br>
    <label for="">Role</label>
    <select id="role">
    <option value="1">User</option>
    <option value="2">Owner</option>
    <option value="3">Admin</option>
</select><br><br>
    <label>Address</label><br>
    <input type="text" id="houseNo" placeholder="House Number"><br>
    <input type="text" id="street" placeholder="Street"><br>
    <input type="text" id="landmark" placeholder="landmark"><br>
    <input type="text" id="city" placeholder="City"><br>
    <input type="text" id="state" placeholder="State"><br>
    <input type="text" id="pinCode" placeholder="PinCode"><br><br>
    <form enctype="multipart/form-data">
    <input type="file" id="profileImage">
    </form>

    <button type="button" onclick="register()">Register</button>

</form>

<script>

async function register() {

    const user = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        phone: document.getElementById("phone").value,
       role:{ id: parseInt(document.getElementById("role").value) },
        address: [{
            houseNo: document.getElementById("houseNo").value,
            streetName: document.getElementById("street").value,
            landmark: document.getElementById("landmark").value,
            city: document.getElementById("city").value,
            state: document.getElementById("state").value,
            pincode: document.getElementById("pinCode").value
        }]
    };


    const formData = new FormData();

formData.append(
    "user",
    new Blob(
        [JSON.stringify(user)],
        { type: "application/json" }
    )
);

formData.append(
    "profileImage",
    document.getElementById("profileImage").files[0]
);

await axios.post(
    "http://localhost:8080/auth/register",
    formData
);

}

</script>

</body>
</html>
