</div>

<script>

    const LOGIN_API_URL = "http://localhost:8080/auth/login";

    const USER_API_URL = "http://localhost:8080/user/getUser";


    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", async function (event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const loginButton =
            document.getElementById("loginButton");

        const result =
            document.getElementById("result");

        loginButton.disabled = true;
        loginButton.innerText = "Logging in...";

        const loginRequest = {
            email: email,
            password: password
        };


        try {

            console.log("=================================");
            console.log("Sending login request...");
           
            console.log("=================================");


            const response = await fetch(LOGIN_API_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(loginRequest)

            });


            console.log("Login status:", response.status);


            const responseText = await response.text();

            console.log("Raw login response:", responseText);


            if (!response.ok) {

                result.innerHTML = `
                    <div class="error">
                        <b>Login failed.</b><br>
                        ${responseText}
                    </div>
                `;

                return;
            }


            let data;

            try {

                data = JSON.parse(responseText);

            } catch (error) {

                console.error(
                    "Login response is not valid JSON:",
                    responseText
                );

                result.innerHTML = `
                    <div class="error">
                        Server returned an invalid login response.
                    </div>
                `;

                return;
            }


            console.log("Login response:", data);


            if (!data.token) {

                console.error(
                    "JWT token missing:",
                    data
                );

                result.innerHTML = `
                    <div class="error">
                        Login succeeded, but no JWT token was returned.
                    </div>
                `;

                return;
            }


            // Store JWT

            localStorage.setItem(
                "token",
                data.token
            );

            localStorage.setItem(
                "email",
                data.email || email
            );


            console.log(
                "JWT stored successfully."
            );


            result.innerHTML = `
                <div class="success">
                    <b>Login successful!</b>
                </div>

                <div class="token-box">
                    <b>JWT received successfully.</b>
                </div>
            `;


            // Fetch authenticated user

            await getUserData();


        } catch (error) {

            console.error(
                "Login request failed:",
                error
            );

            result.innerHTML = `
                <div class="error">
                    Unable to connect to the server.
                    Check that Spring Boot is running on port 8080.
                </div>
            `;

        } finally {

            loginButton.disabled = false;
            loginButton.innerText = "Login";

        }

    });


    async function getUserData() {

        const token =
            localStorage.getItem("token");

        const userDataDiv =
            document.getElementById("userData");


        if (!token) {

            userDataDiv.innerHTML = `
                <div class="error">
                    JWT token not found.
                </div>
            `;

            return;
        }


        console.log("=================================");
        console.log("Fetching authenticated user...");
        console.log("Endpoint:", USER_API_URL);
       
        console.log("=================================");


        try {

            const response = await fetch(
                USER_API_URL,
                {
                    method: "GET",

                    headers: {
                        "Authorization": "Bearer " + token,
                        "Accept": "application/json"
                    }
                }
            );


            console.log(
                "User API status:",
                response.status
            );


            const responseText =
                await response.text();


           


            // 401

            if (response.status === 401) {

                userDataDiv.innerHTML = `
                    <div class="error">
                        <b>401 Unauthorized</b><br>
                        JWT is missing, invalid, or expired.
                    </div>
                `;

                return;
            }


            // 403

            if (response.status === 403) {

                userDataDiv.innerHTML = `
                    <div class="error">
                        <b>403 Forbidden</b><br>
                        Spring Security rejected this request.
                    </div>
                `;

                return;
            }


            // 404

            if (response.status === 404) {

                userDataDiv.innerHTML = `
                    <div class="error">
                        <b>404 Not Found</b><br>
                        Check the controller endpoint:
                        /user/get/email
                    </div>
                `;

                return;
            }


            // Other errors

            if (!response.ok) {

                userDataDiv.innerHTML = `
                    <div class="error">
                        <b>Failed to fetch user.</b><br>
                        HTTP Status: ${response.status}<br>
                        ${responseText}
                    </div>
                `;

                return;
            }


            // Empty response

            if (!responseText ||
                responseText.trim() === "" ||
                responseText.trim() === "null") {

                console.error(
                    "Backend returned null/empty user."
                );

                userDataDiv.innerHTML = `
                    <div class="error">
                        Backend returned no user data.
                        Check UserController and UserService.
                    </div>
                `;

                return;
            }


            let user;

            try {

                user = JSON.parse(responseText);

            } catch (error) {

                console.error(
                    "Invalid JSON from user endpoint:",
                    responseText
                );

                userDataDiv.innerHTML = `
                    <div class="error">
                        Backend returned invalid JSON.
                    </div>
                `;

                return;
            }


           


            if (!user) {

                userDataDiv.innerHTML = `
                    <div class="error">
                        Backend returned null user.
                    </div>
                `;

                return;
            }


            // Role handling

            let role = "N/A";

            if (user.role) {

                if (typeof user.role === "string") {

                    role = user.role;

                } else {

                    role =
                        user.role.roleName ||
                        user.role.name ||
                        "N/A";
                }
            }


            // Display user

            userDataDiv.innerHTML = `

                <div class="user-box">

                    <h3>User Information</h3>

                    <p>
                        <b>Name:</b>
                        ${user.name || "N/A"}
                    </p>

                    <p>
                        <b>Email:</b>
                        ${user.email || "N/A"}
                    </p>

                    <p>
                        <b>User Code:</b>
                        ${user.userCode || "N/A"}
                    </p>

                    <p>
                        <b>Role:</b>
                        ${role}
                    </p>

                </div>

            `;


        } catch (error) {

            console.error(
                "User API request failed:",
                error
            );

            userDataDiv.innerHTML = `
                <div class="error">
                    Unable to fetch user data.<br>
                    Check the browser console.
                </div>
            `;

        }

    }

</script>
