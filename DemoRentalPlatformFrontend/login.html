<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rental Platform - Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:white;
    padding:35px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#1d4ed8;
}

#result{
    margin-top:20px;
    white-space:pre-wrap;
    font-size:14px;
}
</style>

</head>

<body>

<div class="container">

<h2>Login</h2>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Enter Email"
required>

<input
type="password"
id="password"
placeholder="Enter Password"
required>

<button type="submit">
Login
</button>

</form>

<div id="result"></div>

</div>

<script>

const form=document.getElementById("loginForm");

form.addEventListener("submit",async function(e){

e.preventDefault();

const loginRequest={

email:document.getElementById("email").value,

password:document.getElementById("password").value

};

try{

const response=await fetch("http://localhost:8080/auth/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(loginRequest)

});

const result=document.getElementById("result");

if(response.ok){

const data=await response.json();

result.innerHTML=
`
<b>${data.message}</b>

User Code : ${data.userCode}

Role : ${data.role}
`;

console.log(data);

}
else{

const error=await response.text();

result.innerHTML=`<span style="color:red">${error}</span>`;

}

}
catch(err){

document.getElementById("result").innerHTML=
"<span style='color:red'>Unable to connect to the server.</span>";

console.error(err);

}

});

</script>

</body>
</html>
