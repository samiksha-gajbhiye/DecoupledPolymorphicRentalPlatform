<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search Product</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f4f4;
padding:40px;
}

.container{
width:900px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
text-align:center;
margin-bottom:20px;
color:#1565c0;
}

input{
width:80%;
padding:10px;
font-size:16px;
}

button{
padding:10px 20px;
background:#1565c0;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#0d47a1;
}

.card{

margin-top:25px;
padding:20px;
border:1px solid #ddd;
border-radius:8px;
background:#fafafa;

}

img{

width:200px;
height:200px;
object-fit:cover;
margin:10px;
border-radius:8px;
border:1px solid #ccc;

}

.images{

display:flex;
flex-wrap:wrap;

}

</style>

</head>

<body>

<div class="container">

<h2>Search Product</h2>

<input
type="text"
id="title"
placeholder="Enter Product Title">

<button onclick="searchProduct()">

Search

</button>

<div id="result"></div>

</div>

<script>

async function searchProduct(){

const title=document.getElementById("title").value;

const result=document.getElementById("result");

result.innerHTML="Loading...";

try{

const response=await fetch(
"http://localhost:8080/product/title/"+encodeURIComponent(title)
);

if(!response.ok){

result.innerHTML="<h3>No Product Found</h3>";

return;

}

const products=await response.json();

result.innerHTML="";

products.forEach(product=>{

let html=`

<div class="card">

<h2>${product.title}</h2>

<p><b>Product Code :</b> ${product.productCode}</p>

<p><b>Description :</b> ${product.description}</p>

<p><b>Brand :</b> ${product.brand}</p>

<p><b>Model :</b> ${product.model}</p>

<p><b>Price Per Day :</b> ₹${product.pricePerDay}</p>

<p><b>Security Deposit :</b> ₹${product.securityDeposit}</p>

<p><b>Quantity :</b> ${product.quantity}</p>

<p><b>Location :</b> ${product.location}</p>

<p><b>Availability :</b> ${product.availability}</p>

<p><b>Condition :</b> ${product.condition}</p>

<p><b>Verified :</b> ${product.verified}</p>

<p><b>Active :</b> ${product.active}</p>

<h3>Images</h3>

<div class="images">

`;

if(product.images!=null){

product.images.forEach(img=>{

html+=`

<img src="http://localhost:8080/uploads/products/${img.imageUrl}">

`;

});

}

html+=`

</div>

</div>

`;

result.innerHTML+=html;

});

}catch(err){

console.log(err);

result.innerHTML="<h3>Server Error</h3>";

}

}

</script>

</body>

</html>
