<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Product</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f2f4f8;
padding:40px;
}

.container{
width:900px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
text-align:center;
margin-bottom:25px;
color:#1565c0;
}

.row{
display:flex;
gap:20px;
margin-bottom:20px;
}

.col{
flex:1;
}

label{
display:block;
font-weight:bold;
margin-bottom:6px;
}

input,
textarea,
select{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:5px;
}

textarea{
resize:vertical;
}

button{
width:100%;
padding:15px;
background:#1565c0;
color:white;
font-size:18px;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#0d47a1;
}

.section{
margin:25px 0 15px;
border-bottom:2px solid #ddd;
padding-bottom:5px;
}

</style>

</head>

<body>

<div class="container">

<h2>Add Product</h2>

<form id="productForm">

<div class="section">
<h3>Product Details</h3>
</div>

<div class="row">

<div class="col">
<label>User ID</label>
<input type="number" id="userId" required>
</div>

<div class="col">
<label>Category ID</label>
<input type="number" id="categoryId" required>
</div>

</div>

<div class="row">

<div class="col">
<label>Title</label>
<input type="text" id="title" required>
</div>

<div class="col">
<label>Brand</label>
<input type="text" id="brand" required>
</div>

</div>

<div class="row">

<div class="col">
<label>Model</label>
<input type="text" id="model" required>
</div>

<div class="col">
<label>Location</label>
<input type="text" id="location">
</div>

</div>

<label>Description</label>

<textarea id="description" rows="4"></textarea>

<br><br>

<div class="row">

<div class="col">
<label>Price Per Day</label>
<input type="number" step="0.01" id="pricePerDay" required>
</div>

<div class="col">
<label>Security Deposit</label>
<input type="number" step="0.01" id="securityDeposit">
</div>

</div>

<div class="row">

<div class="col">
<label>Quantity</label>
<input type="number" id="quantity" value="1">
</div>

<div class="col">

<label>Condition</label>

<select id="condition">
<option>NEW</option>
<option>LIKE_NEW</option>
<option>GOOD</option>
<option>FAIR</option>
<option>POOR</option>
</select>

</div>

</div>

<div class="row">

<div class="col">

<label>Availability</label>

<select id="availability">
<option>AVAILABLE</option>
<option>BOOKED</option>
<option>RENTED</option>
<option>MAINTENANCE</option>
<option>UNAVAILABLE</option>
</select>

</div>

<div class="col">

<label>Verified</label>

<select id="verified">
<option value="false">False</option>
<option value="true">True</option>
</select>

</div>

</div>

<div class="row">

<div class="col">

<label>Active</label>

<select id="active">
<option value="true">True</option>
<option value="false">False</option>
</select>

</div>

</div>

<div class="section">
<h3>Product Images</h3>
</div>

<input
type="file"
id="images"
multiple
accept="image/*"
required>

<br><br>

<button type="submit">
Add Product
</button>

</form>

</div>

<script>

document.getElementById("productForm").addEventListener("submit", async function(e){

e.preventDefault();

const product = {

user:{
id:Number(document.getElementById("userId").value)
},

category:{
categoryId:Number(document.getElementById("categoryId").value)
},

title:document.getElementById("title").value,

description:document.getElementById("description").value,

brand:document.getElementById("brand").value,

model:document.getElementById("model").value,

pricePerDay:Number(document.getElementById("pricePerDay").value),

location:document.getElementById("location").value,

securityDeposit:Number(document.getElementById("securityDeposit").value || 0),

quantity:Number(document.getElementById("quantity").value),

condition:document.getElementById("condition").value,

availability:document.getElementById("availability").value,

verified:document.getElementById("verified").value === "true",

active:document.getElementById("active").value === "true"

};

const formData = new FormData();

formData.append(
"product",
new Blob(
[JSON.stringify(product)],
{
type:"application/json"
}
)
);

const files = document.getElementById("images").files;

for(let i=0;i<files.length;i++){
formData.append("images", files[i]);
}

try{

const response = await fetch("http://localhost:8080/product/add",{

method:"POST",

body:formData

});

if(response.ok){

const result = await response.json();

console.log(result);

alert("Product Added Successfully!");

document.getElementById("productForm").reset();

}
else{

const error = await response.text();

console.error(error);

alert("Error : " + error);

}

}
catch(err){

console.error(err);

alert("Server Not Reachable.");

}

});

</script>

</body>
</html>
